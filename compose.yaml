x-build: &default-build
  context: ../../
  dockerfile: src/wheeltec_mini_mec_gz_sim/Dockerfile
  args:
    - USERNAME=${USER:-user}
    - USER_UID=${UID:-1000}
    - USER_GID=${GID:-1000}

x-common: &common
  network_mode: host
  ipc: host
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu, graphics, utility, display]
  environment:
    - DISPLAY=${DISPLAY}
    - XAUTHORITY=/home/${USER:-user}/.Xauthority
    - QT_X11_NO_MITSHM=1
    - ROS_DOMAIN_ID=64
    - RCUTILS_COLORIZED_OUTPUT=1
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ${XAUTHORITY}:/home/${USER:-user}/.Xauthority

services:
  gz_sim:
    <<: *common
    build:
      <<: *default-build
      target: deploy
    image: wheeltec_mini_mec/demo
    shm_size: "4gb"
    command: ros2 launch ros_gz_example_bringup wheeltec_mini_mec.launch.py

  nav2_demo:
    <<: *common
    build:
      <<: *default-build
      target: deploy
    image: wheeltec_mini_mec/demo
    depends_on:
      gz_sim:
        condition: service_started
    command: ros2 launch nav2_demo bringup_nav2.launch.py

  dev_shell:
    <<: *common
    build:
      <<: *default-build
      target: development
      network: host
    image: wheeltec_mini_mec/demo-dev
    profiles:
      - development
    stdin_open: true
    tty: true
    working_dir: /home/${USER:-user}/ros2_ws
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY}:/home/${USER:-user}/.Xauthority
      - ../../src:/home/${USER:-user}/ros2_ws/src
    command: bash
